name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Payroll tests and native iPhone build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the independent payroll package
        run: swift test

      - name: Verify repository structure and resources
        run: python3 Scripts/verify_repository.py

      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; iphones=[d for runtime,items in devices.items() if "iOS" in runtime for d in items if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert iphones, "No iPhone simulator is installed"; print(iphones[0]["udid"])')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build and test on iPhone
        run: |
          xcodebuild test \
            -project CanadaPayCalculator.xcodeproj \
            -scheme CanadaPayCalculator \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CanadaPayCalculator.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the Release configuration
        run: |
          xcodebuild build \
            -project CanadaPayCalculator.xcodeproj \
            -scheme CanadaPayCalculator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results
          path: build/CanadaPayCalculator.xcresult
          if-no-files-found: ignore
