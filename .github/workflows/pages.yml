name: Deploy Canada Pay Calculator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Web/**"
      - "Sources/PayrollCore/TaxConfiguration.swift"
      - "Scripts/export_web_tax_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and configuration
        run: npm run check
      - name: Run payroll and PWA tests
        run: npm test
      - name: Build offline application
        run: npm run build
      - name: Install browser for production checks
        run: npx playwright install --with-deps chromium
      - name: Test production app at the Pages project path
        run: npm run test:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Web/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
